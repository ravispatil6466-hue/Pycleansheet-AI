version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pycleansheet-backend
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
      - backend_db:/app/db
    environment:
      - ENV=production
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost
      - DATA_DIR=/app/storage/datasets
      - EXPORT_DIR=/app/storage/exports
      - DATABASE_URL=sqlite:////app/db/pycleansheet.db
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pycleansheet-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_storage:
  backend_db:
